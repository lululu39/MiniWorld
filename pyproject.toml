[project]
name = "miniworld"
version = "0.1.0"
description = "Streaming video diffusion with Transformer, RTransformer and TaS"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "triton==3.4.0",
  "flash-attn==2.8.3", "numpy>=2.2,<2.3", "einops>=0.8,<0.9",
  "decord==0.6.0", "pandas>=2.2,<3", "pyarrow>=19,<20",
  "pillow", "wandb>=0.22,<1", "moviepy>=2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<9"]
[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.8cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }
